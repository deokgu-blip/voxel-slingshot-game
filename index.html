<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Voxel Slingshot</title>

<!-- One-Day Games inline manifest — 인스펙터/플래너용 메타 -->
<script type="application/json" id="odg-manifest">
{
  "version": "1.0",
  "metadata": {
    "title": "Voxel Slingshot",
    "description": "화면 중앙에서 천천히 회전하는 복셀(블록) 조각상을, 하단 슬링샷으로 중력 포물선 탄을 쏴 관통 파괴하는 3D 아케이드. 손가락으로 모델을 돌려 가장 두꺼운 축을 정렬하고, 슬링샷을 당겨 각도·세기를 조준해 한 발에 최대한 많은 복셀을 뚫는다. 탄약(관통 예산 큐)이 떨어지기 전에 전 복셀을 부수면 클리어.",
    "category": "arcade",
    "instructions": "모델(위쪽)을 드래그하면 좌우로 돌려 관통 각을 바꿀 수 있어요. 화면 아래쪽(슬링샷 존)을 당겼다 놓으면 당긴 반대 방향으로 포물선 탄이 발사됩니다. 멀리 당길수록 세게 나가요. 탄이 복셀 더미를 관통하며 와르르 부숩니다. 탄약이 떨어지기 전에 모든 복셀을 부수면 클리어!"
  },
  "renderMode": "3d",
  "assetSlots": [
    {
      "id": "model_main",
      "label": "복셀 모델",
      "type": "model",
      "description": "부술 메인 3D 모델(GLB). 비어 있으면 데이터(VOXEL_MODELS) 또는 절차적 복셀 덩어리가 placeholder로 표시됩니다.",
      "acceptFormats": ["model/gltf-binary", ".glb"],
      "allow3DModel": true,
      "required": false
    },
    {
      "id": "bg",
      "label": "배경(선택)",
      "type": "background",
      "description": "전체 화면 배경. 없으면 차분한 네이비 그라데이션(코드 placeholder).",
      "acceptFormats": ["image/png", "image/webp"],
      "required": false,
      "recommendedWidth": 390,
      "recommendedHeight": 844
    },
    {
      "id": "slingshot",
      "label": "슬링샷(발사대)",
      "type": "sprite",
      "description": "화면 하단 발사대(새총) 그래픽. 없으면 절차적 Y자 새총(선/도형)으로 그려집니다. 정면에서 본 Y자 새총 권장(투명 배경).",
      "acceptFormats": ["image/png", "image/webp"],
      "required": false,
      "recommendedWidth": 240,
      "recommendedHeight": 260
    }
  ],
  "editorMap": {
    "config.GRAVITY": {
      "section": "game-config",
      "symbol": "GAME_CONFIG.GRAVITY",
      "path": ["GRAVITY"],
      "description": "탄/디브리에 작용하는 중력 가속도(월드/초^2). 클수록 포물선이 빨리 떨어짐."
    },
    "config.LAUNCH_POWER_SCALE": {
      "section": "game-config",
      "symbol": "GAME_CONFIG.LAUNCH_POWER_SCALE",
      "path": ["LAUNCH_POWER_SCALE"],
      "description": "슬링샷 드래그 거리(디자인px) → 발사 속도 환산 배율."
    },
    "config.LAUNCH_POWER_MAX": {
      "section": "game-config",
      "symbol": "GAME_CONFIG.LAUNCH_POWER_MAX",
      "path": ["LAUNCH_POWER_MAX"],
      "description": "발사 세기 상한(월드/초). 너무 멀리 당겨도 이 값으로 클램프."
    },
    "config.VOXEL_WORLD": {
      "section": "game-config",
      "symbol": "GAME_CONFIG.VOXEL_WORLD",
      "path": ["VOXEL_WORLD"],
      "description": "복셀 1칸의 월드 크기. 변경 시 모델 전체 스케일과 충돌 반경 환산이 바뀜(레벨 재시작 권장)."
    },
    "config.AUTO_SPIN_SPEED": {
      "section": "game-config",
      "symbol": "GAME_CONFIG.AUTO_SPIN_SPEED",
      "path": ["AUTO_SPIN_SPEED"],
      "description": "모델 자동 회전 속도(rad/초, 월드 Y축 턴테이블). STAGES의 autoSpinSpeed가 우선."
    },
    "config.DRAG_ROTATE_SENS": {
      "section": "game-config",
      "symbol": "GAME_CONFIG.DRAG_ROTATE_SENS",
      "path": ["DRAG_ROTATE_SENS"],
      "description": "모델 영역 드래그 → 회전 민감도(rad/디자인px)."
    },
    "asset.model_main": {
      "section": "game-config",
      "symbol": "GAME_ASSETS.model_main",
      "description": "메인 복셀 모델 GLB 슬롯(비어 있으면 데이터/절차적 placeholder)."
    },
    "asset.bg": {
      "section": "game-config",
      "symbol": "GAME_ASSETS.bg",
      "description": "전체 화면 배경 이미지 슬롯(비어 있으면 네이비 그라데이션)."
    },
    "asset.slingshot": {
      "section": "game-config",
      "symbol": "GAME_ASSETS.slingshot",
      "description": "하단 발사대(새총) 스프라이트 슬롯(비어 있으면 절차적 Y자 새총)."
    },
    "logic.launchProjectile": {
      "section": "game-logic",
      "symbol": "launchProjectile",
      "description": "조준 벡터·세기로 탄을 발사하는 함수(pointerup / 테스트 훅 공용)."
    },
    "logic.checkWin": {
      "section": "game-logic",
      "symbol": "checkWin",
      "description": "복셀 잔여/탄약 큐 소진을 검사해 CLEAR/FAIL을 판정하는 함수."
    },
    "logic.buildStage": {
      "section": "game-logic",
      "symbol": "buildStage",
      "description": "스테이지 데이터를 복셀 InstancedMesh·alive 그리드·탄약 큐로 변환. 변경 시 레벨 재시작 필요."
    }
  }
}
</script>

<!-- ODG_REGION: styles -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg-top: #1b2a4a;
    --bg-bot: #0e1730;
    --asset-bg: linear-gradient(168deg, #233a66 0%, #18264a 52%, #0e1730 100%);
    --hud-text: #ffffff;
    --accent: #ffd23f;
    --game-scale: 1;
  }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0e1730;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #viewport {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    width: 100%; height: 100dvh;
    background: var(--asset-bg);
  }
  #game-container {
    position: relative;
    width: 390px; height: 844px;
    transform: scale(var(--game-scale, 1));
    transform-origin: center center;
    overflow: hidden;
    background: transparent;
  }
  #game-canvas {
    position: absolute; inset: 0;
    width: 390px; height: 844px;
    display: block;
  }
  /* ===== HUD ===== */
  #hud { position: absolute; top: 0; left: 0; right: 0; height: 96px; pointer-events: none; }
  #coin-pill {
    position: absolute; top: 18px; left: 16px;
    display: flex; align-items: center; gap: 7px;
    padding: 7px 15px 7px 9px; border-radius: 19px;
    font-size: 15px; font-weight: 800; color: #fff;
    background: linear-gradient(180deg, #2a3a60, #1b2748);
    border: 1.5px solid rgba(255,255,255,0.18);
    box-shadow: inset 0 2px 3px rgba(255,255,255,0.12), 0 3px 8px rgba(8,12,30,0.4);
  }
  #coin-pill .coin {
    width: 20px; height: 20px; border-radius: 50%;
    background: radial-gradient(circle at 36% 30%, #fff3b0, #ffd23f 55%, #e8a90f 100%);
    border: 1.5px solid #c98c0a;
    box-shadow: inset 0 -2px 3px rgba(150,90,0,0.5);
  }
  #level-pill {
    position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
    min-width: 110px; padding: 8px 22px;
    border-radius: 21px; text-align: center;
    font-size: 17px; font-weight: 800; color: #fff; letter-spacing: 0.5px;
    background: linear-gradient(180deg, #58a0ff 0%, #3b82f6 55%, #2f6fe0 100%);
    border: 2px solid rgba(255,255,255,0.5);
    box-shadow: 0 4px 0 rgba(31,68,140,0.85), 0 8px 14px rgba(15,25,60,0.4), inset 0 2px 0 rgba(255,255,255,0.45);
    text-shadow: 0 2px 0 rgba(31,68,140,0.55);
  }
  #gear {
    position: absolute; top: 18px; right: 16px;
    width: 38px; height: 38px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 19px; color: #cdd6f0;
    background: linear-gradient(180deg, #2a3a60, #1b2748);
    border: 1.5px solid rgba(255,255,255,0.18);
    box-shadow: inset 0 2px 3px rgba(255,255,255,0.12), 0 3px 8px rgba(8,12,30,0.4);
  }
  /* ===== 슬링샷 스프라이트 오버레이(자산 우선) ===== */
  #slingshot-img {
    position: absolute; left: 0; top: 0;
    transform: translate(-50%, -50%);
    pointer-events: none; display: none;
    image-rendering: -webkit-optimize-contrast;
    filter: drop-shadow(0 6px 10px rgba(6,10,26,0.5));
    z-index: 3;
  }
  /* ===== 주머니 탄 위 관통력 숫자 ===== */
  #pocket-num {
    position: absolute; left: 0; top: 0;
    transform: translate(-50%, -50%);
    min-width: 22px; padding: 2px 6px; border-radius: 9px;
    font-size: 14px; font-weight: 900; text-align: center; color: #5a3c00;
    background: linear-gradient(180deg, #fff3b0, #ffd23f 70%, #f0a90f);
    border: 1.5px solid rgba(255,255,255,0.7);
    box-shadow: 0 2px 5px rgba(8,12,30,0.45);
    text-shadow: 0 1px 0 rgba(255,255,255,0.5);
    pointer-events: none; display: none; z-index: 4;
  }
  /* ===== 관통(PIERCE) 라벨 — 탄약 트레이 위 ===== */
  #pierce-label {
    position: absolute; left: 50%; bottom: 70px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 6px;
    padding: 4px 13px 4px 9px; border-radius: 13px;
    font-size: 11px; font-weight: 800; letter-spacing: 1.2px; color: #ffe9a8;
    background: linear-gradient(180deg, rgba(40,54,90,0.78), rgba(22,32,60,0.78));
    border: 1.4px solid rgba(255,210,63,0.35);
    box-shadow: inset 0 1px 2px rgba(255,255,255,0.1);
    pointer-events: none; white-space: nowrap;
  }
  #pierce-label .pick {
    width: 17px; height: 17px; display: inline-block;
    background:
      radial-gradient(circle at 30% 26%, #fff3b0, #ffd23f 60%, #e8a90f 100%);
    -webkit-mask: var(--pick-mask) center / contain no-repeat;
    mask: var(--pick-mask) center / contain no-repeat;
  }
  :root { --pick-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M2 22l5-5 2 2-5 5zM9 13l2 2 8-8c1.5-1.5 1.5-3.5 0-5s-3.5-1.5-5 0zM13 4l7 7'/></svg>"); }
  /* ===== 탄약 큐(하단) ===== */
  #ammo-tray {
    position: absolute; left: 0; right: 0; bottom: 18px;
    display: flex; align-items: flex-end; justify-content: center; gap: 8px;
    pointer-events: none;
  }
  .ammo-slot {
    min-width: 44px; height: 44px; padding: 0 6px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 13px;
    font-size: 17px; font-weight: 900; color: #fff;
    background: linear-gradient(180deg, rgba(40,54,90,0.85), rgba(22,32,60,0.85));
    border: 1.5px solid rgba(255,255,255,0.16);
    box-shadow: inset 0 2px 3px rgba(255,255,255,0.1);
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    transition: transform 160ms ease, opacity 160ms ease, filter 160ms ease;
  }
  .ammo-slot.current {
    transform: translateY(-7px) scale(1.16);
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(255,210,63,0.55), 0 6px 12px rgba(255,180,30,0.4), inset 0 2px 3px rgba(255,255,255,0.2);
    background: linear-gradient(180deg, #ffe27a, #ffd23f 60%, #f0a90f);
    color: #5a3c00; text-shadow: 0 1px 0 rgba(255,255,255,0.5);
  }
  .ammo-slot.spent { opacity: 0.28; filter: grayscale(0.7); transform: scale(0.9); }
  /* ===== 결과 오버레이 ===== */
  .overlay {
    position: absolute; inset: 0;
    display: none;
    flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 42%, rgba(10,16,34,0.2), rgba(10,16,34,0.62) 78%);
    z-index: 10; pointer-events: none;
  }
  .overlay.show { display: flex; pointer-events: auto; }
  .panel {
    position: relative;
    width: 286px; padding: 30px 22px 26px;
    border-radius: 28px;
    background: linear-gradient(168deg, #f6f9ff 0%, #e2e8f4 70%, #cfd8ea 100%);
    border: 2.5px solid rgba(255,255,255,0.9);
    box-shadow: 0 16px 44px rgba(0,0,0,0.5), inset 0 2px 0 rgba(255,255,255,0.95), inset 0 -8px 18px rgba(120,140,190,0.18);
    text-align: center;
  }
  .panel h2 {
    font-size: 31px; font-weight: 900; letter-spacing: 1px;
    color: #1e2a4a; margin-bottom: 7px;
    text-shadow: 0 1px 0 #fff;
  }
  .panel p { font-size: 15px; color: #4a567a; margin-bottom: 20px; }
  .btn {
    display: inline-block; cursor: pointer;
    padding: 14px 34px; border: none; border-radius: 19px;
    font-size: 18px; font-weight: 800; color: #fff; letter-spacing: 0.5px;
    background: linear-gradient(180deg, #5b98ff, #3b82f6 60%, #2f6fe0);
    border-top: 2px solid rgba(255,255,255,0.65);
    box-shadow: 0 6px 0 #2563c4, 0 11px 18px rgba(59,130,246,0.4);
    transition: transform 0.06s ease;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 3px 0 #2563c4, 0 5px 10px rgba(59,130,246,0.4); }
  .btn.win { background: linear-gradient(180deg, #4fe88c, #22c55e 60%, #18a84e); box-shadow: 0 6px 0 #169a4a, 0 11px 18px rgba(34,197,94,0.4); }
  /* ===== 슬링샷 힌트(첫 진입) — 펄스 손가락/화살표 + "Drag to aim" ===== */
  #hint {
    position: absolute; left: 50%; top: 492px;
    transform: translate(-50%, 0);
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    pointer-events: none; z-index: 4;
    will-change: transform, opacity;
  }
  #hint .arrow {
    font-size: 26px; line-height: 1; color: var(--accent);
    text-shadow: 0 2px 5px rgba(0,0,0,0.55);
    animation: hint-bounce 1.1s ease-in-out infinite;
  }
  #hint .finger { font-size: 30px; line-height: 1; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
  #hint .label {
    margin-top: 2px; padding: 5px 14px; border-radius: 14px;
    font-size: 13px; font-weight: 800; letter-spacing: 0.6px; color: #20305a;
    background: linear-gradient(180deg, #ffe27a, #ffd23f 70%, #f0a90f);
    border: 1.5px solid rgba(255,255,255,0.6);
    box-shadow: 0 4px 10px rgba(255,180,30,0.4);
    white-space: nowrap;
  }
  @keyframes hint-bounce {
    0%, 100% { transform: translateY(0); opacity: 0.85; }
    50% { transform: translateY(8px); opacity: 1; }
  }
</style>
<!-- ODG_REGION_END: styles -->

<script>
  // 스탠드얼론 실행 가드 — assembler가 GAME_ASSETS를 주입하지 않은 경우(브라우저 직접 실행).
  // window 프로퍼티 할당(선언 아님)이므로 reserved 룰에 걸리지 않는다.
  if (typeof GAME_ASSETS === 'undefined') { window.GAME_ASSETS = {}; }

  // ===== 디자인 좌표계 =====
  const DESIGN_W = 390;
  const DESIGN_H = 844;
  const C = new Proxy({}, { get: (_, key) => GAME_CONFIG[key] });

  // 테스트 모드 (?test=1) — 배포 영향 없음(L23)
  const IS_TEST = /[?&]test=1/.test(location.search);
  let testTimeScale = 1;

  // ===== 뷰포트 스케일 fit =====
  function updateViewportScale() {
    const sc = Math.min(window.innerWidth / DESIGN_W, window.innerHeight / DESIGN_H, 1);
    document.documentElement.style.setProperty('--game-scale', sc.toFixed(4));
  }
  updateViewportScale();
  window.addEventListener('resize', updateViewportScale);

  // ===== CSS/DOM 슬롯 헬퍼 (bg) =====
  function getAssetUrl(slotId) {
    const a = (typeof GAME_ASSETS !== 'undefined') ? GAME_ASSETS[slotId] : null;
    if (!a) return null;
    return typeof a === 'string' ? a : (a.url || null);
  }
  function applyCssAssetVariables() {
    const bgUrl = getAssetUrl('bg');
    if (bgUrl) {
      document.documentElement.style.setProperty('--asset-bg', 'url("' + bgUrl + '") center / cover no-repeat');
    }
    const slingUrl = getAssetUrl('slingshot');
    if (slingUrl) {
      const el = document.getElementById('slingshot-img');
      if (el) el.src = slingUrl;
    }
  }

  // ===== 에셋 인프라 (§4.4 자체 구현) =====
  // 2D 인프라 룰(loadedImages/preloadAssets/PRELOAD_NO_IMAGE_SRC/LOADED_IMAGES_NOT_USED) 충족 + 3D 모델은 loadedModels.
  const loadedImages = {};
  const loadedModels = {};

  // GLB 모델 프리로드(GLTFLoader 미존재/키없으면 스킵 — 크래시 금지)
  function preloadModels(callback) {
    const keys = Object.keys(GAME_ASSETS || {});
    let remaining = 0;
    const hasLoader = (typeof THREE !== 'undefined') && THREE.GLTFLoader;
    const loader = hasLoader ? new THREE.GLTFLoader() : null;
    for (const key of keys) {
      if (key !== 'model_main') continue;
      const entry = GAME_ASSETS[key];
      const url = typeof entry === 'string' ? entry : (entry && entry.url) || null;
      if (!url || !loader) continue;
      remaining++;
      loader.load(url, function (gltf) {
        loadedModels['model_main'] = gltf.scene || (gltf.scenes && gltf.scenes[0]);
        if (--remaining === 0) callback();
      }, undefined, function () { if (--remaining === 0) callback(); });
    }
    if (remaining === 0) callback();
  }

  // 이미지(bg 등) 프리로드 — 2D 인프라 룰 충족(loadedImages는 bg를 통해 읽힘)
  function preloadAssets(callback) {
    applyCssAssetVariables();
    const keys = Object.keys(GAME_ASSETS || {});
    let remaining = keys.length;
    if (remaining === 0) { preloadModels(callback); return; }
    let imgDone = false;
    const afterImages = function () { if (!imgDone) { imgDone = true; preloadModels(callback); } };
    for (const key of keys) {
      const entry = GAME_ASSETS[key];
      const url = typeof entry === 'string' ? entry : (entry && entry.url) || null;
      if (!url) { if (--remaining === 0) afterImages(); continue; }
      const img = new Image();
      img.onload = function () { loadedImages[key] = img; if (--remaining === 0) afterImages(); };
      img.onerror = function () { if (--remaining === 0) afterImages(); };
      img.src = url;
    }
  }

  // ===== 오디오/햅틱 훅 (POC 무음 폴백 — STAGE9에서 data URI 주입) =====
  window.__audio = (function () {
    const pools = {};
    const lastPlay = {};
    let unlocked = false;
    const NAMES = ['launch', 'crunch', 'puff', 'clear'];
    function srcOf(name) { const a = window.GAME_AUDIO; return (a && a[name]) || null; }
    function unlock() {
      if (unlocked) return; unlocked = true;
      for (const n of NAMES) {
        const s = srcOf(n); if (!s) continue;
        const pool = [];
        for (let i = 0; i < 3; i++) { const el = new Audio(s); el.preload = 'auto'; pool.push(el); }
        pools[n] = pool;
      }
    }
    function play(name) {
      if (!GAME_CONFIG.SFX || !unlocked) return;
      const pool = pools[name]; if (!pool) return;
      const now = performance.now();
      if (lastPlay[name] && now - lastPlay[name] < 55) return;
      lastPlay[name] = now;
      let el = null;
      for (let i = 0; i < pool.length; i++) { if (pool[i].paused || pool[i].ended) { el = pool[i]; break; } }
      if (!el) el = pool[0];
      try { el.currentTime = 0; el.play().catch(function () {}); } catch (e) {}
    }
    return { unlock: unlock, play: play };
  })();
  function haptic(ms) {
    if (GAME_CONFIG.HAPTIC && navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} }
  }
  function playSfx(name) { window.__audio.play(name); }

  // ===== 상태 머신 (gameState는 reserved — 다른 이름 'game' 사용) =====
  const PHASE = { READY: 'READY', AIMING: 'AIMING', FLYING: 'FLYING', CLEAR: 'CLEAR', FAIL: 'FAIL' };
  let game = {
    phase: PHASE.READY,
    stageIndex: 0,
    modelYaw: 0,
    modelPitch: 0,
    voxelsAlive: 0,
    ammoIndex: 0
  };
  if (IS_TEST) {
    const sm = location.search.match(/[?&]stage=(\d+)/);
    if (sm) game.stageIndex = parseInt(sm[1], 10) || 0;
  }

  // ===== 색 유틸 =====
  function hexToRgb(hex) {
    const h = hex.replace('#', '');
    return { r: parseInt(h.substring(0, 2), 16), g: parseInt(h.substring(2, 4), 16), b: parseInt(h.substring(4, 6), 16) };
  }
  function hexNum(hex) { const c = hexToRgb(hex); return (c.r << 16) | (c.g << 8) | c.b; }

  // ===== base64 → Uint8Array (복셀 디코드) =====
  function b64ToBytes(b64) {
    const bin = atob(b64);
    const len = bin.length;
    const out = new Uint8Array(len);
    for (let i = 0; i < len; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  // PMREM 환경맵 — 캔버스 그라데이션(네이비 스튜디오)을 등방 환경으로
  function setupEnvironment() {
    const cv = document.createElement('canvas');
    cv.width = 16; cv.height = 64;
    const cg = cv.getContext('2d');
    const g2 = cg.createLinearGradient(0, 0, 0, 64);
    g2.addColorStop(0, '#cdd8f5');
    g2.addColorStop(0.45, '#7d8fc4');
    g2.addColorStop(0.55, '#3a4a78');
    g2.addColorStop(1, '#141f3c');
    cg.fillStyle = g2; cg.fillRect(0, 0, 16, 64);
    const envTex = new THREE.CanvasTexture(cv);
    envTex.mapping = THREE.EquirectangularReflectionMapping;
    view.pmrem = new THREE.PMREMGenerator(view.renderer);
    const rt = view.pmrem.fromEquirectangular(envTex);
    view.scene.environment = rt.texture;
    envTex.dispose();
  }

  function initProjectile() {
    const r = C.PROJECTILE_RADIUS * C.VOXEL_WORLD;
    const geo = new THREE.SphereGeometry(r, 20, 16);
    const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2, metalness: 0.55, envMapIntensity: 1.1 });
    mat.color.setHex(0xf4f4f5).convertSRGBToLinear();
    mat.emissive.setHex(0x556080).convertSRGBToLinear();

  // 궤적 점: 위치 + per-point 알파(끝으로 갈수록 페이드) — 셰이더 보강으로 밝고 큰 점
  const trajAlpha = new Float32Array(64);
  function initTrajectory() {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(trajArr, 3));
    geo.setAttribute('aAlpha', new THREE.BufferAttribute(trajAlpha, 1));
    geo.setDrawRange(0, 0);
    const mat = new THREE.ShaderMaterial({
      transparent: true, depthTest: false, depthWrite: false,
      uniforms: { uSize: { value: C.TRAJECTORY_DOT_SIZE * (view.renderer.getPixelRatio() || 1) } },
      vertexShader:
        'attribute float aAlpha; varying float vA;' +
        'uniform float uSize;' +
        'void main(){ vA=aAlpha; vec4 mv=modelViewMatrix*vec4(position,1.0);' +
        'gl_Position=projectionMatrix*mv; gl_PointSize=uSize; }',
      fragmentShader:
        'varying float vA;' +
        'void main(){ vec2 c=gl_PointCoord-vec2(0.5); float d=length(c);' +
        'if(d>0.5) discard; float core=smoothstep(0.5,0.16,d);' +
        'vec3 col=mix(vec3(1.0,0.72,0.18), vec3(1.0,0.96,0.74), core);' +
        'gl_FragColor=vec4(col, vA*core); }'
    });
    trajMesh = new THREE.Points(geo, mat);
    trajMesh.renderOrder = 6;
    trajMesh.frustumCulled = false;
    trajMesh.visible = false;
    view.scene.add(trajMesh);
  }

  // 슬링샷(절차적 Y자) + 주머니 탄 + 고무줄 2가닥 초기화

  // ===== 절차적 복셀 덩어리 (fallback placeholder — 오리 느낌의 타원체 + 줄무늬) =====
  function buildProceduralVoxels() {
    const W = 19, H = 17, D = 15;
    const coords = [];        // [x,y,z,colorIdx]
    const rx = (W - 1) / 2, ry = (H - 1) / 2 - 1.5, rz = (D - 1) / 2;
    const cx = (W - 1) / 2, cyBody = (H - 1) / 2 - 1, cz = (D - 1) / 2;
    for (let x = 0; x < W; x++) {
      for (let y = 0; y < H; y++) {
        for (let z = 0; z < D; z++) {
          // 몸통(타원체)
          const dxB = (x - cx) / rx, dyB = (y - cyBody) / (ry * 0.95), dzB = (z - cz) / rz;
          const inBody = (dxB * dxB + dyB * dyB + dzB * dzB) <= 1;
          // 머리(작은 구, 위쪽 앞)
          const hr = 3.6, hcx = cx, hcy = H - 3.2, hcz = cz + 2.4;
          const dxH = x - hcx, dyH = y - hcy, dzH = z - hcz;
          const inHead = (dxH * dxH + dyH * dyH + dzH * dzH) <= hr * hr;
          if (!inBody && !inHead) continue;
          // 색: 줄무늬(노랑 기본) + 머리 부리(주황) + 눈(어두움)
          let colorIdx = 0;            // yellow
          if (inHead) {
            colorIdx = 0;
            // 부리(앞쪽 아래)
            if (z >= hcz + 1.5 && y <= hcy && y >= hcy - 2) colorIdx = 1;  // orange
            // 눈(좌우 점)
            if (Math.abs(y - (hcy + 0.5)) < 0.9 && Math.abs(z - (hcz + 1.2)) < 1.2 && Math.abs(Math.abs(x - hcx) - 2.2) < 0.9) colorIdx = 7;  // dark
          } else {
            // 몸통 줄무늬(살짝 톤 차이로 볼륨감)
            colorIdx = (y % 4 === 0) ? 1 : 0;
            if (y <= 1) colorIdx = 1;  // 배 아래 주황 띠
          }
          coords.push(x, y, z, colorIdx);
        }
      }
    }
    return { W: W, H: H, D: D, palette: VOXEL_PALETTE.slice(), coords: coords };
  }

  // 데이터 모델 디코드 (VOXEL_MODELS[modelId])
  function decodeVoxelModel(model) {
    const W = model.size[0], H = model.size[1], D = model.size[2];
    const bytes = b64ToBytes(model.voxels);
    const coords = [];
    for (let i = 0; i + 3 < bytes.length; i += 4) {
      coords.push(bytes[i], bytes[i + 1], bytes[i + 2], bytes[i + 3]);
    }
    return { W: W, H: H, D: D, palette: model.palette || VOXEL_PALETTE.slice(), coords: coords };
  }

  function findVoxelModel(modelId) {
    for (let i = 0; i < VOXEL_MODELS.length; i++) {
      if (VOXEL_MODELS[i].id === modelId) return VOXEL_MODELS[i];
    }
    return null;
  }

  // ===== 스테이지 빌드 =====
  function buildStage(idx) {
    const stage = STAGES[idx % STAGES.length];
    game.stageIndex = idx % STAGES.length;
    game.phase = PHASE.READY;
    game.modelYaw = 0;
    game.modelPitch = 0;
    game.ammoIndex = 0;
    proj.active = false;
    if (projMesh) projMesh.visible = false;
    if (trajMesh) trajMesh.visible = false;
    winTimer = 0;
    hideOverlay();

    // 회전 그룹 비우기
    if (voxModelGroup) {
      while (voxModelGroup.children.length) {
        const ch = voxModelGroup.children[0];
        voxModelGroup.remove(ch);
        ch.traverse && ch.traverse(function (o) { if (o.geometry && o !== voxMesh) o.geometry.dispose(); });
      }
    }
    glbGroup = null;

    // 디브리 비활성
    for (let i = 0; i < debrisPool.length; i++) debrisPool[i].active = false;

    // ===== 자산 분기: GLB가 있으면 우선, 없으면 데이터/절차적 복셀 =====
    if (loadedModels['model_main']) {
      buildFromGlb();
    } else {
      buildVoxelGridFromData(stage.modelId);
    }

    // 탄약 큐
    ammoQueue = stage.ammo.slice();
    rebuildAmmoTray();
    levelPill.textContent = 'Level ' + stage.id;

    // 카메라 프레이밍
    frameModel();
  }

  // GLB 우선 분기(자산 적용 시) — clone을 회전 그룹에 부착, 복셀 충돌은 비활성(원본 데이터 없음 → 절차적 복셀로 대체 충돌)
  function buildFromGlb() {
    const src = loadedModels['model_main'];
    glbGroup = src.clone(true);
    // 모델 중심 정렬 + 적당한 스케일은 frameModel에서 처리(여기선 원점 보정)
    const box = new THREE.Box3().setFromObject(glbGroup);
    const center = box.getCenter(tmpV);
    glbGroup.position.set(-center.x, -center.y, -center.z);
    const holder = new THREE.Group();
    holder.add(glbGroup);
    voxModelGroup.add(holder);
    // GLB는 복셀 충돌 데이터가 없으므로, 내부에 절차적 복셀 충돌 그리드를 함께 구축(보이지 않게)해 게임 진행 유지
    buildVoxelGridFromData('duck', true);
  }

  // 데이터/절차적 복셀 → InstancedMesh + alive 그리드
  // hiddenForGlb=true면 복셀 메시는 투명(충돌만 사용)
  function buildVoxelGridFromData(modelId, hiddenForGlb) {
    const dataModel = findVoxelModel(modelId);
    const dec = dataModel ? decodeVoxelModel(dataModel) : buildProceduralVoxels();

    const W = dec.W, H = dec.H, D = dec.D;
    vox.W = W; vox.H = H; vox.D = D;
    vox.cx = (W - 1) / 2; vox.cy = (H - 1) / 2; vox.cz = (D - 1) / 2;
    vox.palette = dec.palette;
    const total = W * H * D;
    vox.alive = new Uint8Array(total);
    vox.keyToInst = new Int32Array(total).fill(-1);

    const n = dec.coords.length / 4;
    // 기존 voxMesh 제거
    if (voxMesh) {
      voxModelGroup.remove(voxMesh);
      voxMesh.geometry.dispose();
      voxMesh = null;
    }

    const vw = C.VOXEL_WORLD * (1 - C.VOXEL_GAP);
    const geo = new THREE.BoxGeometry(vw, vw, vw);
    const mat = new THREE.MeshStandardMaterial({
      color: 0xffffff, roughness: 0.42, metalness: 0.08, envMapIntensity: 0.9,
      transparent: !!hiddenForGlb, opacity: hiddenForGlb ? 0 : 1
    });
    voxMesh = new THREE.InstancedMesh(geo, mat, n);
    voxMesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(n * 3), 3);
    voxMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    voxMesh.frustumCulled = false;
    voxMesh.visible = !hiddenForGlb;

    const col = new THREE.Color();
    let inst = 0;
    let alive = 0;
    for (let i = 0; i < n; i++) {
      const x = dec.coords[i * 4], y = dec.coords[i * 4 + 1], z = dec.coords[i * 4 + 2];
      const ci = dec.coords[i * 4 + 3];
      if (x < 0 || x >= W || y < 0 || y >= H || z < 0 || z >= D) continue;
      const vkey = x + y * W + z * W * H;
      if (vox.alive[vkey]) continue;  // 중복 좌표 방지
      vox.alive[vkey] = 1;
      vox.keyToInst[vkey] = inst;
      // 월드 로컬 좌표(그리드 중심 원점 정렬)
      dummy.obj.position.set((x - vox.cx) * C.VOXEL_WORLD, (y - vox.cy) * C.VOXEL_WORLD, (z - vox.cz) * C.VOXEL_WORLD);
      dummy.obj.scale.set(1, 1, 1);
      dummy.obj.rotation.set(0, 0, 0);
      dummy.obj.updateMatrix();
      voxMesh.setMatrixAt(inst, dummy.obj.matrix);
      const hex = vox.palette[ci] || '#FFD23F';
      col.setStyle(hex).convertSRGBToLinear();
      voxMesh.setColorAt(inst, col);
      inst++;
      alive++;
    }
    voxMesh.count = inst;
    voxMesh.instanceMatrix.needsUpdate = true;
    if (voxMesh.instanceColor) voxMesh.instanceColor.needsUpdate = true;
    voxModelGroup.add(voxMesh);
    game.voxelsAlive = alive;
  }

  // 파괴: 인스턴스 스케일0 + needsUpdate + count는 유지(빈 슬롯), voxelsAlive--
  function destroyVoxel(vkey) {
    if (!vox.alive[vkey]) return false;
    vox.alive[vkey] = 0;
    const inst = vox.keyToInst[vkey];
    if (inst >= 0 && voxMesh) {
      dummy.obj.position.set(0, -99999, 0);
      dummy.obj.scale.set(0.0001, 0.0001, 0.0001);
      dummy.obj.updateMatrix();
      voxMesh.setMatrixAt(inst, dummy.obj.matrix);
    }
    game.voxelsAlive--;
    return true;
  }

  // ===== 카메라 프레이밍 (거리 고정 + 모델 scale로 화면 채움 — L21) =====
  function frameModel() {
    const el = C.CAM_TILT * Math.PI / 180;
    const camDist = 1000;
    view.camera.fov = C.CAM_FOV;
    view.camera.position.set(0, Math.sin(el) * camDist, Math.cos(el) * camDist);
    view.camera.up.set(0, 1, 0);
    view.camera.lookAt(0, 0, 0);
    view.camera.updateProjectionMatrix();
    view.camera.updateMatrixWorld(true);

    // 모델 반경(복셀 그리드 또는 GLB) → 화면에서 차지할 목표 반경에 맞춰 scale
    let modelRadius;
    if (glbGroup) {
      const box = new THREE.Box3().setFromObject(glbGroup);
      box.getSize(tmpV);
      modelRadius = 0.5 * Math.max(tmpV.x, tmpV.y, tmpV.z);
    } else {
      const halfW = (vox.W * C.VOXEL_WORLD) / 2;
      const halfH = (vox.H * C.VOXEL_WORLD) / 2;
      const halfD = (vox.D * C.VOXEL_WORLD) / 2;
      modelRadius = Math.sqrt(halfW * halfW + halfH * halfH + halfD * halfD);
    }
    // 화면 세로의 MODEL_FRAME_FILL 비율을 채우도록 거리/scale 산정
    const vFovHalf = (view.camera.fov * Math.PI / 180) / 2;
    // 화면 상단~중앙에 모델: 목표 화면 반경(월드) = camDist * tan(vFovHalf) * fill
    const targetWorldRadius = camDist * Math.tan(vFovHalf) * C.MODEL_FRAME_FILL * 0.5;
    const scale = targetWorldRadius / modelRadius;
    voxModelGroup.scale.set(scale, scale, scale);
    // 모델을 화면 중앙~상단으로 살짝 올림
    voxModelGroup.position.set(0, modelRadius * scale * 0.32 + 40, 0);
  }

  // ===== 회전 (월드축 턴테이블 — yaw/pitch 스칼라, quaternion 매 프레임 재구성) =====
  function applyModelRotation() {
    qYaw.setFromAxisAngle(axisY, game.modelYaw);
    qPitch.setFromAxisAngle(axisX, game.modelPitch);
    qModel.copy(qYaw);
    qModel.premultiply(qPitch);
    qModel.normalize();
    voxModelGroup.quaternion.copy(qModel);
    voxModelGroup.updateMatrixWorld(true);
  }

  // 디자인(px) → z평면(z=zPlane)과의 교점 월드 — planeHit에 기록
  const planeHit = [0, 0, 0];
  function designToPlane(dx, dy, zPlane) {
    const ndcX = (dx / DESIGN_W) * 2 - 1;
    const ndcY = -(dy / DESIGN_H) * 2 + 1;
    tmpV.set(ndcX, ndcY, 0.5).unproject(view.camera);
    tmpV2.copy(view.camera.position);
    tmpV.sub(tmpV2).normalize();   // 방향
    const t = Math.abs(tmpV.z) < 1e-6 ? 0 : (zPlane - tmpV2.z) / tmpV.z;
    planeHit[0] = tmpV2.x + tmpV.x * t;
    planeHit[1] = tmpV2.y + tmpV.y * t;
    planeHit[2] = zPlane;
  }

  // ===== 슬링샷 기하(월드) 갱신 — 화면 px 앵커를 z=0 평면으로 unproject =====
  function updateSlingGeom() {
    const cxPx = DESIGN_W / 2;
    const baseYPx = C.SLING_ANCHOR_Y_PX;
    const forkYPx = baseYPx - C.SLING_FORK_HEIGHT_PX;   // 갈래 끝(위)
    designToPlane(cxPx, baseYPx, 0);
    sling.baseX = planeHit[0]; sling.baseY = planeHit[1]; sling.baseZ = planeHit[2];
    designToPlane(cxPx - C.SLING_FORK_HALF_PX, forkYPx, 0);
    sling.forkLX = planeHit[0]; sling.forkLY = planeHit[1];
    designToPlane(cxPx + C.SLING_FORK_HALF_PX, forkYPx, 0);
    sling.forkRX = planeHit[0]; sling.forkRY = planeHit[1];
    sling.forkCX = (sling.forkLX + sling.forkRX) / 2;
    sling.forkCY = (sling.forkLY + sling.forkRY) / 2;
  }

  // 현재 주머니 월드 위치(당김 반영) — 당김은 화면 px(aimDX,aimDY) 기준, 월드 스케일로 변환
  // 주머니 = 갈래중심 + (당김 반대편 아래쪽)으로 이동. 당김 px → 월드 변환은 갈래 폭 비율로 산출.
  function computePocket() {
    // 화면 px 당김 → 월드: 화면 px당 월드거리 = (forkR - forkL 월드폭) / (2*forkHalf px)
    const worldPerPx = Math.abs(sling.forkRX - sling.forkLX) / (2 * C.SLING_FORK_HALF_PX);
    let pullPx = clampPull();
    const pdx = (pullPx > 0 ? player.aimDX : 0);
    const pdy = (pullPx > 0 ? player.aimDY : 0);
    // 주머니는 당긴 방향(화면)으로 이동 (PULL_VISUAL_SCALE 만큼 시각 축소)
    const vis = C.PULL_VISUAL_SCALE * worldPerPx;
    // rest 위치는 갈래중심보다 살짝 위(크로스바 위에 얹힘 → 숫자가 가려지지 않음)
    const restLift = C.VOXEL_WORLD * 1.4;
    sling.pocketX = sling.forkCX + pdx * vis;
    sling.pocketY = sling.forkCY + restLift - pdy * vis;   // 화면 아래(+dy) = 월드 아래(-y)
    sling.pocketZ = sling.baseZ + Math.max(0, pdy) * vis * 0.45;  // 아래로 당기면 살짝 카메라쪽(+z)
  }

  // 당김 px 길이(클램프)
  function clampPull() {
    let len = Math.sqrt(player.aimDX * player.aimDX + player.aimDY * player.aimDY);
    if (len > C.PULL_MAX_PX) len = C.PULL_MAX_PX;
    return len;
  }

  // 발사 origin = 현재 주머니 위치(당김 반영) — fire/궤적 공용
  const anchor = { x: 0, y: 0, z: 0 };
  function computeAnchor() {
    updateSlingGeom();
    computePocket();
    anchor.x = sling.pocketX; anchor.y = sling.pocketY; anchor.z = sling.baseZ;
  }

  // 현재 조준 방향/세기 산출 — 발사벡터 = 주머니 → 갈래중심(당긴 반대), 세기 ∝ 당긴 거리
  const aimOut = { dx: 0, dy: 0, dz: 0, power: 0 };
  function computeAim() {
    const pullPx = clampPull();
    let power = pullPx * C.LAUNCH_POWER_SCALE;
    if (power > C.LAUNCH_POWER_MAX) power = C.LAUNCH_POWER_MAX;
    // 방향: 주머니 → 갈래중심(당긴 반대) = 화면상 위쪽. 오리는 z=0 평면 중심이므로
    //   화면평면(z≈0) 슛으로 중앙 칼럼을 관통(깊이는 반경 + 자동회전이 커버). 깊이(-z) 전진은 소량만.
    let dx = sling.forkCX - sling.pocketX;
    let dy = (sling.forkCY - sling.pocketY) + C.LAUNCH_UP_BOOST;
    let dz = -Math.abs(dy) * C.LAUNCH_FORWARD_RATIO;
    const len = Math.sqrt(dx * dx + dy * dy + dz * dz) || 1;
    aimOut.dx = dx / len; aimOut.dy = dy / len; aimOut.dz = dz / len;
    aimOut.power = power;
  }

  // ===== 슬링샷 + 주머니 탄 + 고무줄 레이아웃(월드 + DOM 오버레이) =====
  function layoutSlingshot() {
    if (!slingGroup) return;
    updateSlingGeom();
    const showSling = (game.phase === PHASE.READY || game.phase === PHASE.AIMING);

    // 절차적 Y자 새총 배치(자산 없을 때만)
    const useSprite = !!loadedImages['slingshot'];
    slingGroup.visible = showSling && !useSprite;
    if (slingGroup.visible) {
      const ud = slingGroup.userData;
      // 밑동: base → forkCenter
      placeArm(ud.baseM, sling.baseX, sling.baseY, sling.baseZ, sling.forkCX, sling.forkCY, sling.baseZ, 1.0);
      // 두 갈래: forkCenter(약간 아래) → 각 갈래끝
      placeArm(ud.armL, sling.forkCX, sling.forkCY - (sling.forkCY - sling.baseY) * 0.18, sling.baseZ, sling.forkLX, sling.forkLY, sling.baseZ, 1.0);
      placeArm(ud.armR, sling.forkCX, sling.forkCY - (sling.forkCY - sling.baseY) * 0.18, sling.baseZ, sling.forkRX, sling.forkRY, sling.baseZ, 1.0);
    }

    // 스프라이트 오버레이(자산 우선) — 갈래폭에 맞춰 스케일, 갈래 중앙 정렬
    if (useSprite && showSling) {
      const img = loadedImages['slingshot'];
      const natW = (img && img.naturalWidth) || 1;
      const natH = (img && img.naturalHeight) || 1;
      // 스프라이트의 좌우 갈래 끝이 화면 갈래폭(2*half + 약간 여백)에 맞도록
      const w = C.SLING_FORK_HALF_PX * 2 + 60;
      const h = w * (natH / natW);
      slingImgEl.style.width = w + 'px';
      slingImgEl.style.height = h + 'px';
      slingImgEl.style.left = (DESIGN_W / 2) + 'px';
      // 스프라이트는 (translate -50%,-50%) → 중심을 갈래 중앙 살짝 아래(주머니 포함)에 둠
      slingImgEl.style.top = (C.SLING_ANCHOR_Y_PX - C.SLING_FORK_HEIGHT_PX * 0.5) + 'px';
      slingImgEl.style.display = 'block';
    } else {
      slingImgEl.style.display = 'none';
    }

    // 주머니 탄 + 숫자 + 고무줄
    if (showSling && game.ammoIndex < ammoQueue.length) {
      computePocket();
      pocketMesh.visible = true;
      pocketMesh.position.set(sling.pocketX, sling.pocketY, sling.pocketZ);
      // 고무줄: 좌갈래→주머니, 우갈래→주머니
      bandArr[0] = sling.forkLX; bandArr[1] = sling.forkLY; bandArr[2] = sling.baseZ;
      bandArr[3] = sling.pocketX; bandArr[4] = sling.pocketY; bandArr[5] = sling.pocketZ;
      bandArr[6] = sling.forkRX; bandArr[7] = sling.forkRY; bandArr[8] = sling.baseZ;
      bandArr[9] = sling.pocketX; bandArr[10] = sling.pocketY; bandArr[11] = sling.pocketZ;
      bandMesh.geometry.attributes.position.needsUpdate = true;
      bandMesh.visible = true;
      // 주머니 위 관통력 숫자(DOM, project)
      tmpV.set(sling.pocketX, sling.pocketY, sling.pocketZ).project(view.camera);
      const sx = (tmpV.x * 0.5 + 0.5) * DESIGN_W;
      const sy = (-tmpV.y * 0.5 + 0.5) * DESIGN_H;
      pocketNumEl.style.display = 'block';
      pocketNumEl.style.left = sx + 'px';
      pocketNumEl.style.top = (sy - C.PROJECTILE_RADIUS * 11) + 'px';
      pocketNumEl.textContent = ammoQueue[game.ammoIndex];
    } else {
      pocketMesh.visible = false;
      bandMesh.visible = false;
      pocketNumEl.style.display = 'none';
    }
  }

  // 원기둥(arm)을 두 점 사이에 배치(길이/회전) — A→B (z 고정 평면)
  function placeArm(mesh, ax, ay, az, bx, by, bz, thick) {
    const mx = (ax + bx) / 2, my = (ay + by) / 2, mz = (az + bz) / 2;
    const dx = bx - ax, dy = by - ay, dz = bz - az;
    const len = Math.sqrt(dx * dx + dy * dy + dz * dz) || 1;
    mesh.position.set(mx, my, mz);
    mesh.scale.set(thick, len, thick);
    // 기본 원기둥 축 +Y를 (dx,dy,dz) 방향으로 정렬
    tmpV.set(dx / len, dy / len, dz / len);
    mesh.quaternion.setFromUnitVectors(axisY, tmpV);
  }

  function launchProjectile() {
    if (game.phase === PHASE.FLYING || game.phase === PHASE.CLEAR || game.phase === PHASE.FAIL) return;
    if (game.ammoIndex >= ammoQueue.length) return;
    computeAnchor();
    computeAim();
    let power = aimOut.power;
    if (power < C.LAUNCH_POWER_MIN) power = C.LAUNCH_POWER_MIN;
    proj.active = true;
    proj.px = anchor.x; proj.py = anchor.y; proj.pz = anchor.z;
    proj.vx = aimOut.dx * power;
    proj.vy = aimOut.dy * power;
    proj.vz = aimOut.dz * power;
    proj.budget = ammoQueue[game.ammoIndex];
    proj.radius = C.PROJECTILE_RADIUS;
    if (projMesh) {
      projMesh.position.set(proj.px, proj.py, proj.pz);
      projMesh.visible = true;
    }
    if (trajMesh) trajMesh.visible = false;
    // 주머니 탄/고무줄/숫자 숨김(발사한 자리에서 출발)
    if (pocketMesh) pocketMesh.visible = false;
    if (bandMesh) bandMesh.visible = false;
    pocketNumEl.style.display = 'none';
    slingImgEl.style.display = 'none';
    game.phase = PHASE.FLYING;
    hideHint();
    playSfx('launch');
    haptic(12);
  }

  // ===== 궤적 미리보기 (중력 적분 예측 점들) =====
  function updateTrajectory() {
    if (!trajMesh) return;
    computeAnchor();
    computeAim();
    let power = aimOut.power;
    if (power < C.LAUNCH_POWER_MIN) power = C.LAUNCH_POWER_MIN;
    let px = anchor.x, py = anchor.y, pz = anchor.z;
    let vx = aimOut.dx * power, vy = aimOut.dy * power, vz = aimOut.dz * power;
    const dots = C.TRAJECTORY_DOTS | 0;
    const dtp = C.TRAJECTORY_DT;
    let w = 0;
    for (let i = 0; i < dots; i++) {
      // 실제 발사와 동일한 적분(GRAVITY 동일) — 예측=실제 일치
      vy -= C.GRAVITY * dtp;
      px += vx * dtp; py += vy * dtp; pz += vz * dtp;
      trajArr[w] = px; trajArr[w + 1] = py; trajArr[w + 2] = pz;
      // 끝으로 갈수록 페이드(앞은 밝게)
      trajAlpha[i] = 1.0 - (i / dots) * 0.78;
      w += 3;
    }
    trajMesh.geometry.attributes.position.needsUpdate = true;
    trajMesh.geometry.attributes.aAlpha.needsUpdate = true;
    trajMesh.geometry.setDrawRange(0, dots);
    trajMesh.visible = true;
  }

  // ===== 물리 + 관통 충돌 (회전 프레임 정합) =====
  function updateProjectile(dt) {
    if (!proj.active) return;
    const speed = Math.sqrt(proj.vx * proj.vx + proj.vy * proj.vy + proj.vz * proj.vz);
    const rWorld = proj.radius * C.VOXEL_WORLD;
    let steps = Math.ceil((speed * dt) / (rWorld * 0.5));
    if (steps < 1) steps = 1;
    if (steps > 24) steps = 24;
    const sdt = dt / steps;
    for (let s = 0; s < steps; s++) {
      proj.vy -= C.GRAVITY * sdt;
      proj.px += proj.vx * sdt;
      proj.py += proj.vy * sdt;
      proj.pz += proj.vz * sdt;
      collideProjectile();
      if (!proj.active) break;
      // 경계 밖(아래로 떨어지거나 멀리) → 소멸
      if (proj.py < -1400 || Math.abs(proj.px) > 2400 || Math.abs(proj.pz) > 2400) {
        proj.active = false;
        if (projMesh) projMesh.visible = false;
        advanceAmmo();
        break;
      }
    }
    if (projMesh && proj.active) projMesh.position.set(proj.px, proj.py, proj.pz);
  }

  // 탄 월드 → modelGroup 로컬 → 그리드좌표 → 반경 내 alive 파괴
  function collideProjectile() {
    if (!voxMesh) return;
    // 월드 → 로컬(회전 그룹 역변환). worldToLocal은 내부에서 임시 없음(Matrix4 사용) — tmpLocal 재사용
    tmpLocal.set(proj.px, proj.py, proj.pz);
    voxModelGroup.worldToLocal(tmpLocal);
    // 로컬 → 그리드(복셀 인덱스). 로컬 좌표는 (idx - center)*VOXEL_WORLD
    const gx = tmpLocal.x / C.VOXEL_WORLD + vox.cx;
    const gy = tmpLocal.y / C.VOXEL_WORLD + vox.cy;
    const gz = tmpLocal.z / C.VOXEL_WORLD + vox.cz;
    const r = proj.radius;
    const ri = Math.ceil(r);
    const x0 = Math.max(0, Math.floor(gx - ri)), x1 = Math.min(vox.W - 1, Math.ceil(gx + ri));
    const y0 = Math.max(0, Math.floor(gy - ri)), y1 = Math.min(vox.H - 1, Math.ceil(gy + ri));
    const z0 = Math.max(0, Math.floor(gz - ri)), z1 = Math.min(vox.D - 1, Math.ceil(gz + ri));
    const r2 = r * r;
    let any = false;
    for (let x = x0; x <= x1; x++) {
      for (let y = y0; y <= y1; y++) {
        for (let z = z0; z <= z1; z++) {
          const vkey = x + y * vox.W + z * vox.W * vox.H;
          if (!vox.alive[vkey]) continue;
          const dx = x - gx, dy = y - gy, dz = z - gz;
          if (dx * dx + dy * dy + dz * dz > r2) continue;
          const inst = vox.keyToInst[vkey];
          spawnDebris(x, y, z, inst);
          destroyVoxel(vkey);
          proj.budget--;
          any = true;
          if (proj.budget <= 0) break;
        }
        if (proj.budget <= 0) break;
      }
      if (proj.budget <= 0) break;
    }
    if (any) {
      if (voxMesh) voxMesh.instanceMatrix.needsUpdate = true;
      playSfx('crunch');
      haptic(6);
    }
    if (proj.budget <= 0 && proj.active) {
      proj.active = false;
      if (projMesh) projMesh.visible = false;
      playSfx('puff');
      advanceAmmo();
    }
    if (any) checkWin();
  }

  // ===== 디브리 풀 =====
  let debrisColorScratch = null;   // initThree에서 1회 생성
  function spawnDebris(gx, gy, gz, instId) {
    // 월드 위치(현재 회전 적용)
    tmpLocal.set((gx - vox.cx) * C.VOXEL_WORLD, (gy - vox.cy) * C.VOXEL_WORLD, (gz - vox.cz) * C.VOXEL_WORLD);
    voxModelGroup.localToWorld(tmpLocal);
    let slot = null;
    for (let i = 0; i < debrisPool.length; i++) { if (!debrisPool[i].active) { slot = debrisPool[i]; break; } }
    if (!slot) return;
    slot.active = true;
    slot.x = tmpLocal.x; slot.y = tmpLocal.y; slot.z = tmpLocal.z;
    // 속도 = 탄 방향 + 랜덤 스프레드
    const sp = C.DEBRIS_SPREAD;
    slot.vx = proj.vx * 0.12 + (Math.random() - 0.5) * sp;
    slot.vy = proj.vy * 0.12 + Math.random() * sp * 0.8 + 40;
    slot.vz = proj.vz * 0.12 + (Math.random() - 0.5) * sp;
    slot.life = C.DEBRIS_LIFETIME * (0.7 + Math.random() * 0.6);
    slot.maxLife = slot.life;
    // 색: 파괴된 복셀의 인스턴스 컬러를 디브리 인스턴스로 복사
    if (voxMesh && voxMesh.instanceColor && instId >= 0) {
      const arr = voxMesh.instanceColor.array;
      slot.cr = arr[instId * 3]; slot.cg = arr[instId * 3 + 1]; slot.cb = arr[instId * 3 + 2];
    } else { slot.cr = 1; slot.cg = 0.82; slot.cb = 0.25; }
  }

  function updateDebris(dt) {
    if (!debrisMesh) return;
    let anyActive = false;
    for (let i = 0; i < debrisPool.length; i++) {
      const d = debrisPool[i];
      if (!d.active) continue;
      anyActive = true;
      d.vy -= C.DEBRIS_GRAVITY * dt;
      d.x += d.vx * dt; d.y += d.vy * dt; d.z += d.vz * dt;
      d.life -= dt;
      if (d.life <= 0 || d.y < -1500) {
        d.active = false;
        debrisDummy.obj.position.set(0, -99999, 0);
        debrisDummy.obj.scale.set(0.0001, 0.0001, 0.0001);
        debrisDummy.obj.updateMatrix();
        debrisMesh.setMatrixAt(i, debrisDummy.obj.matrix);
        continue;
      }
      const f = d.life / d.maxLife;
      const sc = 0.5 + f * 0.6;
      debrisDummy.obj.position.set(d.x, d.y, d.z);
      debrisDummy.obj.rotation.set(d.x * 0.02 + simTime * 6, d.z * 0.02 + simTime * 5, 0);
      debrisDummy.obj.scale.set(sc, sc, sc);
      debrisDummy.obj.updateMatrix();
      debrisMesh.setMatrixAt(i, debrisDummy.obj.matrix);
      debrisColorScratch.setRGB(d.cr, d.cg, d.cb);
      debrisMesh.setColorAt(i, debrisColorScratch);
    }
    debrisMesh.instanceMatrix.needsUpdate = true;
    if (debrisMesh.instanceColor) debrisMesh.instanceColor.needsUpdate = true;
    debrisMesh.visible = anyActive;
  }

  // ===== 탄약 진행/승패 =====
  function advanceAmmo() {
    if (game.phase === PHASE.CLEAR || game.phase === PHASE.FAIL) return;
    game.ammoIndex++;
    rebuildAmmoTray();
    if (game.voxelsAlive <= 0) { return; }   // checkWin이 이미 처리
    if (game.ammoIndex >= ammoQueue.length) {
      game.phase = PHASE.FAIL;
      showOverlay(false);
    } else {
      game.phase = PHASE.READY;
    }
  }

  function checkWin() {
    if (game.voxelsAlive <= 0 && game.phase !== PHASE.CLEAR) {
      game.phase = PHASE.CLEAR;
      proj.active = false;
      if (projMesh) projMesh.visible = false;
      winTimer = C.WIN_DELAY_MS;
      playSfx('clear');
      haptic(30);
    }
  }

  // ===== 탄약 트레이(HTML) =====
  function rebuildAmmoTray() {
    ammoTrayEl.innerHTML = '';
    for (let i = 0; i < ammoQueue.length; i++) {
      const slot = document.createElement('div');
      slot.className = 'ammo-slot';
      if (i < game.ammoIndex) slot.classList.add('spent');
      else if (i === game.ammoIndex) slot.classList.add('current');
      slot.textContent = ammoQueue[i];
      ammoTrayEl.appendChild(slot);
    }
  }

  // ===== 오버레이 =====
  function showOverlay(win) {
    resultOverlay.classList.add('show');
    if (win) {
      resultTitle.textContent = 'Clear!';
      resultMsg.textContent = 'All voxels destroyed!';
      resultBtn.textContent = 'Next';
      resultBtn.classList.add('win');
    } else {
      resultTitle.textContent = 'Out of Ammo';
      resultMsg.textContent = (game.voxelsAlive) + ' voxels left';
      resultBtn.textContent = 'Retry';
      resultBtn.classList.remove('win');
    }
  }
  function hideOverlay() { resultOverlay.classList.remove('show'); }
  function hideHint() { if (hintShown) { hintShown = false; hintEl.style.display = 'none'; } }

  // ===== 입력 (CSS px 기준 — getBoundingClientRect, L1) =====
  function toDesign(clientX, clientY) {
    const rect = gameCanvas.getBoundingClientRect();
    const sx = rect.width / DESIGN_W;
    const sy = rect.height / DESIGN_H;
    return { x: (clientX - rect.left) / sx, y: (clientY - rect.top) / sy };
  }

  function onPointerDown(clientX, clientY) {
    if (game.phase === PHASE.CLEAR || game.phase === PHASE.FAIL) return;
    const d = toDesign(clientX, clientY);
    player.pointerDown = true;
    player.lastX = d.x; player.lastY = d.y;
    player.aimDX = 0; player.aimDY = 0;
    player.rotDX = 0; player.rotDY = 0;
    hideHint();   // 첫 상호작용에 드래그 힌트 사라짐
    if (d.y >= C.AIM_ZONE_TOP_PX && game.phase !== PHASE.FLYING) {
      // 조준 존(하단) — 당기기 시작
      player.aiming = true;
      player.rotating = false;
      if (game.phase === PHASE.READY) game.phase = PHASE.AIMING;
    } else {
      // 모델 영역(회전)
      player.aiming = false;
      player.rotating = true;
    }
  }

  function onPointerMove(clientX, clientY) {
    if (!player.pointerDown) return;
    const d = toDesign(clientX, clientY);
    const dx = d.x - player.lastX;
    const dy = d.y - player.lastY;
    player.lastX = d.x; player.lastY = d.y;
    if (player.aiming) {
      player.aimDX += dx;
      player.aimDY += dy;
    } else if (player.rotating) {
      player.rotDX += dx;
      player.rotDY += dy;
    }
  }

  function onPointerUp() {
    if (!player.pointerDown) return;
    player.pointerDown = false;
    if (player.aiming) {
      player.aiming = false;
      // 충분히 당겼으면 발사
      const dragLen = Math.sqrt(player.aimDX * player.aimDX + player.aimDY * player.aimDY);
      if (dragLen > 12 && game.phase === PHASE.AIMING) {
        launchProjectile();
      } else if (game.phase === PHASE.AIMING) {
        game.phase = PHASE.READY;   // 살짝만 당겼으면 발사 취소
      }
      if (trajMesh) trajMesh.visible = false;
    }
    player.rotating = false;
    player.aimDX = 0; player.aimDY = 0;
  }

  containerEl.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    window.__audio.unlock();
    onPointerDown(e.clientX, e.clientY);
  });
  window.addEventListener('pointermove', function (e) { onPointerMove(e.clientX, e.clientY); });
  window.addEventListener('pointerup', function () { onPointerUp(); });
  containerEl.addEventListener('touchstart', function (e) {
    e.preventDefault();
    window.__audio.unlock();
    if (e.touches[0]) onPointerDown(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: false });
  containerEl.addEventListener('touchmove', function (e) {
    e.preventDefault();
    if (e.touches[0]) onPointerMove(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: false });
  containerEl.addEventListener('touchend', function (e) { e.preventDefault(); onPointerUp(); }, { passive: false });
  document.addEventListener('keydown', function (e) {
    if ([' ', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) e.preventDefault();
  });
  resultBtn.addEventListener('click', function (e) {
    e.preventDefault();
    if (game.phase === PHASE.CLEAR) buildStage(game.stageIndex + 1);
    else buildStage(game.stageIndex);
  });

  // ===== 메인 루프 =====
  function gameLoop(ts) {
    if (!lastFrame) lastFrame = ts || 0;
    let dt = ((ts || 0) - lastFrame) / 1000;
    lastFrame = ts || 0;
    if (dt > 0.05) dt = 0.05;
    if (!dt || dt < 0) dt = 0.016;
    dt *= testTimeScale;

    if (!window.__HOLD) {
      simTime += dt;
      // 회전: 자동 + 드래그(루프가 입력 상태 player를 읽음 — INPUT_NOT_USED_IN_LOOP 충족)
      const stage = STAGES[game.stageIndex % STAGES.length];
      const autoSpin = (stage && typeof stage.autoSpinSpeed === 'number') ? stage.autoSpinSpeed : C.AUTO_SPIN_SPEED;
      if (game.phase !== PHASE.CLEAR && game.phase !== PHASE.FAIL) {
        game.modelYaw += autoSpin * dt + player.rotDX * C.DRAG_ROTATE_SENS;
        let np = game.modelPitch - player.rotDY * C.DRAG_ROTATE_SENS;
        const clampR = C.PITCH_CLAMP_DEG * Math.PI / 180;
        if (np > clampR) np = clampR; if (np < -clampR) np = -clampR;
        game.modelPitch = np;
      }
      player.rotDX = 0; player.rotDY = 0;
      if (voxModelGroup) applyModelRotation();

      // 슬링샷/주머니 탄/고무줄 레이아웃(매 프레임 — 회전/모델과 무관, READY/AIMING만 표시)
      layoutSlingshot();

      // 조준 중이면 궤적 미리보기(루프가 player.aiming 읽음)
      if (player.aiming && game.phase === PHASE.AIMING) {
        updateTrajectory();
      } else if (trajMesh && game.phase !== PHASE.AIMING) {
        trajMesh.visible = false;
      }

      if (game.phase === PHASE.FLYING) updateProjectile(dt);
      updateDebris(dt);

      if (winTimer > 0) {
        winTimer -= dt * 1000;
        if (winTimer <= 0) { winTimer = 0; showOverlay(true); }
      }
    }

    if (view.ready) view.renderer.render(view.scene, view.camera);
    requestAnimationFrame(gameLoop);
  }

  // ===== 테스트 훅 (?test=1 — 배포 무해, L23) =====
  if (IS_TEST) {
    window.__test = {
      state: function () {
        return {
          phase: game.phase, stage: game.stageIndex,
          voxelsAlive: game.voxelsAlive, ammoIndex: game.ammoIndex,
          ammoTotal: ammoQueue.length, projActive: proj.active,
          modelYaw: game.modelYaw, modelPitch: game.modelPitch,
          activeDebris: debrisPool.reduce(function (a, d) { return a + (d.active ? 1 : 0); }, 0),
          projX: proj.px, projY: proj.py, projZ: proj.pz,
          modelCx: voxModelGroup ? voxModelGroup.position.x : 0,
          modelCy: voxModelGroup ? voxModelGroup.position.y : 0,
          modelCz: voxModelGroup ? voxModelGroup.position.z : 0
        };
      },
      // 프로그램적 발사: dir(월드 단위 벡터) + power로 직접 쏨. radiusMul/budgetOverride로 카빙 강도 조절(테스트 전용)
      fire: function (dx, dy, dz, power, radiusMul, budgetOverride) {
        if (game.ammoIndex >= ammoQueue.length) return false;
        computeAnchor();
        const len = Math.sqrt(dx * dx + dy * dy + dz * dz) || 1;
        proj.active = true;
        proj.px = anchor.x; proj.py = anchor.y; proj.pz = anchor.z;
        proj.vx = dx / len * power; proj.vy = dy / len * power; proj.vz = dz / len * power;
        proj.budget = budgetOverride || ammoQueue[game.ammoIndex];
        proj.radius = C.PROJECTILE_RADIUS * (radiusMul || 1);
        if (projMesh) { projMesh.position.set(proj.px, proj.py, proj.pz); projMesh.visible = true; }
        game.phase = PHASE.FLYING;
        return true;
      },
      // 조준 벡터로 자동 발사(모델 중심을 향해 — 확실히 관통)
      fireAtModel: function (power, radiusMul, budgetOverride) {
        computeAnchor();
        // 모델 중심 월드 = voxModelGroup.position
        const tx = voxModelGroup.position.x - anchor.x;
        const ty = voxModelGroup.position.y - anchor.y;
        const tz = voxModelGroup.position.z - anchor.z;
        return window.__test.fire(tx, ty + 30, tz, power || C.PROJECTILE_SPEED_BASE, radiusMul, budgetOverride);
      },
      // 모델 중심 + 오프셋(월드 단위) 지점을 겨냥해 실제 반경·실제 탄약으로 발사 — 플레이어의 '남은 부위 조준'을 모사
      fireOffset: function (ox, oy, oz, power) {
        computeAnchor();
        const tx = voxModelGroup.position.x + (ox || 0) - anchor.x;
        const ty = voxModelGroup.position.y + (oy || 0) - anchor.y;
        const tz = voxModelGroup.position.z + (oz || 0) - anchor.z;
        return window.__test.fire(tx, ty, tz, power || C.PROJECTILE_SPEED_BASE);
      },
      modelInfo: function () {
        return { cx: voxModelGroup.position.x, cy: voxModelGroup.position.y, cz: voxModelGroup.position.z, voxelWorld: C.VOXEL_WORLD };
      },
      // 남아있는 복셀 하나를 정확히 겨냥해 발사(고속·실제 반경·실제 탄약) — 숙련 플레이어의 정밀 조준 모사
      fireAtAlive: function (power) {
        computeAnchor();
        const alive = vox.alive; let cnt = 0;
        for (let k = 0; k < alive.length; k++) if (alive[k]) cnt++;
        if (!cnt) return false;
        let pick = (Math.random() * cnt) | 0, vk = -1;
        for (let k = 0; k < alive.length; k++) { if (alive[k]) { if (pick-- === 0) { vk = k; break; } } }
        const x = vk % vox.W, y = ((vk / vox.W) | 0) % vox.H, z = (vk / (vox.W * vox.H)) | 0;
        tmpV.set((x - vox.cx) * C.VOXEL_WORLD, (y - vox.cy) * C.VOXEL_WORLD, (z - vox.cz) * C.VOXEL_WORLD);
        voxModelGroup.localToWorld(tmpV);
        return window.__test.fire(tmpV.x - anchor.x, tmpV.y - anchor.y + 26, tmpV.z - anchor.z, power || 1200);
      },
      // 캡처용: 조준 상태 강제(주머니 당김) — dx,dy는 화면 px 당김(아래로 당기려면 dy>0)
      aimTo: function (dx, dy) {
        game.phase = PHASE.AIMING;
        player.aiming = true;
        player.aimDX = dx || 0;
        player.aimDY = dy || 0;
        hideHint();
        layoutSlingshot();
        updateTrajectory();
      },
      // 캡처용: READY로 복귀(슬링샷+주머니 탄 표시)
      ready: function () {
        game.phase = PHASE.READY;
        player.aiming = false;
        player.aimDX = 0; player.aimDY = 0;
        layoutSlingshot();
      },
      setRotation: function (yaw, pitch) { game.modelYaw = yaw; game.modelPitch = pitch; if (voxModelGroup) applyModelRotation(); },
      speed: function (x) { testTimeScale = x || 1; },
      hold: function (v) { window.__HOLD = v !== false; },
      loadStage: function (i) { buildStage(i); },
      voxCount: function () { return game.voxelsAlive; },
      stats: function () {
        const inf = view.renderer ? view.renderer.info.render : { calls: 0, triangles: 0 };
        return { calls: inf.calls, triangles: inf.triangles };
      }
    };
  }

  // ===== 부팅 =====
  if (typeof THREE === 'undefined') {
    console.warn('[voxel-slingshot] THREE 런타임 미주입(renderMode 3d). 게임을 시작할 수 없습니다.');
  } else {
    initThree();
    buildStage(game.stageIndex);
    applyModelRotation();
    if (view.ready) view.renderer.render(view.scene, view.camera);
    preloadAssets(function () {
      buildStage(game.stageIndex);
      requestAnimationFrame(gameLoop);
    });
  }
</script>
